<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fanta Buzzer - Minimal Dark</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <style>
        :root {
            --bg-main: #0B1120;
            --bg-card: #1E293B;
            --bg-hover: #334155;
            --accent-blue: #3B82F6;
            --accent-blue-hover: #2563EB;
            --accent-green: #10B981;
            --accent-red: #EF4444;
            --accent-red-hover: #DC2626;
            --text-main: #F8FAFC;
            --text-muted: #94A3B8;
            --border-color: #334155;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            margin: 0; 
            padding: 0; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            height: 100dvh; 
            background-color: var(--bg-main);
            color: var(--text-main);
            text-align: center; 
            overflow: hidden; 
            touch-action: manipulation; 
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; position: relative;}
        .active { display: flex; }

        .setup-card { 
            background-color: var(--bg-card); 
            padding: 40px 30px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            width: 90%; 
            max-width: 400px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            box-sizing: border-box;
        }

        h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: 2px; }
        .logo-text span { color: var(--accent-blue); }
        p.subtitle { color: var(--text-muted); font-weight: 400; font-size: 1rem; margin-bottom: 25px; margin-top: 5px;}

        input, .minimal-input { 
            font-family: 'Inter', sans-serif; font-size: 1.1rem; padding: 15px; margin-bottom: 15px; 
            text-align: center; width: 100%; box-sizing: border-box; background: var(--bg-main);
            border: 1px solid var(--border-color); color: var(--text-main); border-radius: 8px; outline: none; transition: 0.2s; 
        }
        input:focus, .minimal-input:focus { border-color: var(--accent-blue); }
        
        .btn { 
            font-family: 'Inter', sans-serif; font-size: 1.1rem; padding: 15px 30px; margin: 10px 0; width: 100%; 
            cursor: pointer; border: none; border-radius: 8px; background-color: var(--accent-blue); 
            color: white; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; box-sizing: border-box;
        }
        .btn:hover { background-color: var(--accent-blue-hover); }
        .btn:active { transform: scale(0.98); }
        
        .btn-secondary { background-color: transparent; border: 1px solid var(--border-color); color: var(--text-muted); }
        .btn-secondary:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .btn-green { background-color: var(--accent-green); }
        .btn-green:hover { background-color: #059669; }
        button:disabled { background-color: var(--bg-hover) !important; color: var(--text-muted) !important; cursor: not-allowed; transform: none !important;}
        
        .status { display: none !important; }

        /* ========================================= */
        /* SCHERMATA GIOCATORE (BUZZER + INFO)       */
        /* ========================================= */
        #screen-player-buzzer {
            justify-content: space-between;
            padding: 3vh 5vw;
        }

        .phone-top-area {
            flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            width: 100%; max-width: 400px;
        }

        .phone-card-image { width: auto; height: 18vh; max-height: 160px; object-fit: contain; filter: drop-shadow(0 5px 10px rgba(0,0,0,0.5)); margin-bottom: 10px;}
        .phone-player-name { font-size: 1.6rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 5px; line-height: 1.1;}

        .player-auction-info {
            background: var(--bg-card); padding: 10px; border-radius: 12px; border: 1px solid var(--border-color);
            width: 100%; box-sizing: border-box; display: flex; flex-direction: column; align-items: center;
        }

        .buzzer-bottom-area {
            flex: 1; display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
            width: 100%; padding-bottom: 2vh;
        }

        .buzzer-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 15px; width: 100%; max-width: 380px; margin-bottom: 15px;
        }

        .buzzer-btn { 
            width: 100%; aspect-ratio: 1; border-radius: 20px; background: var(--accent-red); border: none;
            color: white; font-family: 'Inter', sans-serif; font-size: 3rem; font-weight: 800; 
            box-shadow: 0 0 25px rgba(239, 68, 68, 0.3); cursor: pointer; user-select: none; transition: 0.1s; 
            -webkit-tap-highlight-color: transparent; 
        }
        .buzzer-btn:active { transform: scale(0.92); box-shadow: 0 0 10px rgba(239, 68, 68, 0.6); background: var(--accent-red-hover); }

        #display-team-name { color: var(--text-muted); font-size: 1.2rem; font-weight: 800; text-transform: uppercase; letter-spacing: 2px; margin: 0; }

        /* ========================================= */
        /* PLANCIA BANDITORE COMUNE                  */
        /* ========================================= */
        .dashboard { display: flex; flex-direction: column; background: transparent; box-sizing: border-box; overflow: hidden; width: 100%; }
        
        #view-list { display: flex; flex-direction: column; width: 100%; height: 100%; }
        
        /* TABELLA E SCORRIMENTO */
        .table-container { flex: 1; overflow-y: auto; min-height: 0; border: 1px solid var(--border-color); border-radius: 8px; background: var(--bg-main); }
        table { width: 100%; border-collapse: collapse; text-align: left; table-layout: fixed; }
        th { 
            position: sticky; top: 0; background: var(--bg-card); border-bottom: 2px solid var(--border-color); 
            font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; z-index: 10;
            cursor: pointer; user-select: none; transition: color 0.2s;
        }
        th:hover { color: var(--text-main); }
        td { border-bottom: 1px solid var(--border-color); color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis;}
        tr:hover { background: var(--bg-hover); cursor: pointer; }
        
        .role-badge { display: inline-block; padding: 4px 6px; border-radius: 4px; font-weight: 800; text-align: center; min-width: 20px;}
        .role-P { background: #EAB308; color: #000; }
        .role-D { background: #22C55E; color: #000; }
        .role-C { background: #3B82F6; color: #fff; }
        .role-A { background: #EF4444; color: #fff; }

        #view-auction { display: none; width: 100%; height: 100%; gap: 20px; }
        .auction-col { width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; }
        
        .player-name-top { font-size: 2.5rem; font-weight: 800; color: var(--text-main); text-transform: uppercase; margin-bottom: 10px; text-align: center; letter-spacing: 1px; }

        .player-card { display: flex; flex-direction: column; align-items: center; justify-content: center; }
        .player-card img { object-fit: contain; background: transparent; border: none; padding: 0; filter: drop-shadow(0 10px 20px rgba(0,0,0,0.5)); }
        
        .arrow-btn { display: none; background: transparent; border: 3px solid var(--text-main); color: var(--text-main); border-radius: 50%; cursor: pointer; transition: all 0.2s ease; align-items: center; justify-content: center; }
        .arrow-btn:hover { background: var(--text-main); color: var(--bg-main); transform: scale(1.05); }
        .arrow-btn svg { stroke: currentColor; }

        /* ========================================= */
        /* LAYOUT PC (ORIZZONTALE)                   */
        /* ========================================= */
        .mode-pc .dashboard { width: 100%; max-width: 1400px; height: 90vh; border: 1px solid var(--border-color); border-radius: 16px; padding: 30px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); background: var(--bg-card); }
        .mode-pc .dashboard-layout { display: flex; flex-direction: row; width: 100%; height: 100%; align-items: stretch; justify-content: space-between; gap: 20px;}
        .mode-pc .dashboard-left { flex: 1.2; display: flex; flex-direction: column; background: var(--bg-main); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; overflow: hidden; }
        
        .mode-pc th:nth-child(1) { width: 10%; }
        .mode-pc th:nth-child(2) { width: 45%; }
        .mode-pc th:nth-child(3) { width: 30%; }
        .mode-pc th:nth-child(4) { width: 15%; text-align: right;}

        .mode-pc th { padding: 12px 15px; font-size: 0.8rem; }
        .mode-pc td { padding: 12px 15px; font-size: 1rem; }
        
        .mode-pc #view-auction { flex-direction: row; justify-content: space-around; align-items: center; }
        .mode-pc .player-card img { width: 300px; max-height: 450px; }
        
        /* TESTI INGRANDITI PER PC */
        .mode-pc #countdown-display { font-size: 22rem; font-weight: 800; color: var(--text-main); line-height: 0.8; font-variant-numeric: tabular-nums; margin: 30px 0; }
        .mode-pc #winner-display { font-size: 4rem; font-weight: 800; color: var(--accent-blue); min-height: 1.2em; word-wrap: break-word; text-transform: uppercase; margin: 10px 0; text-align: center;}
        .mode-pc #current-value-display { font-size: 10rem; font-weight: 900; color: var(--text-main); margin: 20px 0; line-height: 0.8;}
        .mode-pc .auction-title { font-size: 1.8rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 2px; }
        
        .mode-pc .arrow-btn { width: 90px; height: 90px; margin-top: 40px; }
        .mode-pc .arrow-btn svg { width: 45px; height: 45px; }

        /* ========================================= */
        /* LAYOUT SMARTPHONE (VERTICALE)             */
        /* ========================================= */
        .mode-mobile .dashboard { width: 100%; height: 100dvh; max-height: -webkit-fill-available; border-width: 0; border-radius: 0; padding: 2vh 15px; box-shadow: none; background: transparent; }
        .mode-mobile .dashboard-layout { display: flex; flex-direction: column; width: 100%; height: 100%; gap: 10px; }
        .mode-mobile .dashboard-left { flex: 1; display: flex; flex-direction: column; min-height: 0; }
        
        .mode-mobile th:nth-child(1) { width: 12%; }
        .mode-mobile th:nth-child(2) { width: 45%; }
        .mode-mobile th:nth-child(3) { width: 25%; }
        .mode-mobile th:nth-child(4) { width: 18%; text-align: right;}

        .mode-mobile th { padding: 10px 8px; font-size: 0.75rem; }
        .mode-mobile td { padding: 10px 8px; font-size: 0.85rem; }
        
        .mode-mobile #view-auction { flex-direction: column; justify-content: space-evenly; align-items: center; gap: 0; padding: 1vh 0; }
        .mode-mobile .player-name-top { font-size: 1.8rem; margin-bottom: 1vh; letter-spacing: 1px; line-height: 1.1;}
        .mode-mobile .player-card img { width: auto; max-height: 25vh; padding: 0; }
        
        .mode-mobile .auction-col:nth-child(2) { justify-content: flex-start; }
        
        /* TESTI INGRANDITI PER MOBILE */
        .mode-mobile .auction-title { font-size: 1.2rem; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 1px; margin-top: 1vh;}
        .mode-mobile #winner-display { font-size: 2.8rem; font-weight: 800; color: var(--accent-blue); min-height: 1.2em; word-wrap: break-word; text-transform: uppercase; margin: 0; text-align: center;}
        .mode-mobile #current-value-display { font-size: 6.5rem; font-weight: 900; color: var(--text-main); margin: 10px 0; line-height: 0.8;}
        .mode-mobile #countdown-display { font-size: 12rem; font-weight: 800; color: var(--text-main); line-height: 0.8; font-variant-numeric: tabular-nums; margin: 15px 0; }
        
        .mode-mobile .arrow-btn { width: 70px; height: 70px; margin-top: 15px; }
        .mode-mobile .arrow-btn svg { width: 35px; height: 35px; }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-main); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

    </style>
</head>
<body>

    <div id="screen-role" class="screen active">
        <div class="setup-card">
            <h1 class="logo-text">Fanta<span>Buzzer</span></h1>
            <p class="subtitle">Seleziona il dispositivo</p>
            <button class="btn" onclick="showScreen('screen-player-setup')">Giocatore</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-device-choice')">Banditore</button>
        </div>
    </div>

    <div id="screen-device-choice" class="screen">
        <div class="setup-card">
            <h1>Dispositivo</h1>
            <p class="subtitle">Ottimizza la plancia dell'Asta</p>
            <button class="btn btn-green" onclick="setDeviceMode('pc')">💻 Computer / Smart TV</button>
            <button class="btn" onclick="setDeviceMode('mobile')">📱 Smartphone / Tablet</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-role')">Indietro</button>
        </div>
    </div>

    <div id="screen-player-setup" class="screen">
        <div class="setup-card">
            <h1>Squadra</h1>
            <p class="subtitle">Identificativo postazione</p>
            <input type="text" id="team-name" placeholder="Es. Real Madrid..." autocomplete="off">
            <button class="btn" onclick="joinAsPlayer()">Connetti</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-role')">Indietro</button>
        </div>
    </div>

    <!-- SCHERMATA GIOCATORE -->
    <div id="screen-player-buzzer" class="screen">
        
        <div class="phone-top-area" id="phone-card-container" style="visibility: hidden;">
            <div class="phone-player-name" id="phone-player-name">--</div>
            <img class="phone-card-image" id="phone-card-image" src="" alt="Player">
            
            <div class="player-auction-info">
                <div style="font-size: 0.8rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px;">Miglior Offerta</div>
                <div id="player-current-winner" style="font-size: 1.3rem; font-weight: 800; color: var(--text-muted); line-height: 1.2;">Nessuno</div>
                <div id="player-current-value" style="font-size: 2.5rem; font-weight: 900; color: var(--text-main); line-height: 1;">0</div>
            </div>
        </div>

        <div class="buzzer-bottom-area">
            <div class="buzzer-grid">
                <button class="buzzer-btn" onpointerdown="buzz(1)">+1</button>
                <button class="buzzer-btn" onpointerdown="buzz(5)">+5</button>
                <button class="buzzer-btn" onpointerdown="buzz(10)">+10</button>
                <button class="buzzer-btn" onpointerdown="buzz(20)">+20</button>
            </div>
            <h2 id="display-team-name"></h2>
        </div>
        
    </div>

    <div id="screen-auctioneer-setup" class="screen">
        <div class="setup-card">
            <h1>Setup Asta</h1>
            <p class="subtitle" style="margin-top: 0; margin-bottom: 5px;">Timer Base (Secondi):</p>
            <input type="number" id="auction-seconds" value="5" min="1" max="60">
            
            <div id="excel-status" style="font-size: 1rem; margin: 25px 0; font-weight: 600; color: var(--accent-blue);">
                🔄 Ricerca del file listone.xlsx...
            </div>

            <button class="btn" id="btn-apri-plancia" onclick="joinAsAuctioneer()" disabled>Avvia Sessione</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-device-choice')">Indietro</button>
        </div>
    </div>

    <div id="screen-auctioneer-board" class="screen">
        <div class="dashboard" id="auction-dashboard">
            <div class="dashboard-layout">
                
                <div id="view-list">
                    <div class="dashboard-left">
                        
                        <div style="display: flex; gap: 10px; width: 100%; margin-bottom: 10px;">
                            <input type="text" id="player-search" class="minimal-input" placeholder="Cerca calciatore..." oninput="filterTable(event)" autocomplete="off" style="margin-bottom: 0; flex: 1;">
                            <button class="btn btn-secondary" onclick="changeTimer()" style="width: auto; margin: 0; padding: 0 15px; font-size: 1.5rem;" title="Impostazioni Timer">⚙️</button>
                        </div>

                        <div class="table-container">
                            <table id="players-table">
                                <thead>
                                    <tr>
                                        <th onclick="sortTable('R')" title="Ordina per Ruolo">R ↕</th>
                                        <th onclick="sortTable('Nome')" title="Ordina per Nome">Nome ↕</th>
                                        <th onclick="sortTable('Squadra')" title="Ordina per Squadra">Squadra ↕</th>
                                        <th onclick="sortTable('Val')" style="text-align: right;" title="Ordina per Valutazione">Val. ↕</th>
                                    </tr>
                                </thead>
                                <tbody id="players-tbody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <div id="view-auction">
                    <div class="auction-col">
                        <div class="player-name-top" id="auction-player-name-top">--</div>
                        <div class="player-card" id="auction-player-card">
                            <img id="card-image" src="" alt="Player">
                        </div>
                    </div>

                    <div class="auction-col">
                        <div class="auction-title">Miglior Offerente</div>
                        <div id="winner-display">--</div>
                        <div id="current-value-display">0</div>
                        <div id="countdown-display">--</div>
                        
                        <button class="arrow-btn" id="btn-next" onclick="backToList()" title="Torna alla Lista">
                            <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                                <polyline points="12 5 19 12 12 19"></polyline>
                            </svg>
                        </button>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <audio id="audio-prep" src="preparazione.mp3" preload="auto"></audio>
    <audio id="audio-start" src="fischio.mp3" preload="auto"></audio>
    <audio id="audio-buzz" src="buzz.mp3" preload="auto"></audio>
    <audio id="audio-end" src="gong.mp3" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://hphslrpgohrfdecvvhap.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwaHNscnBnb2hyZmRlY3Z2aGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDc4NTUsImV4cCI6MjEwMjI4Mzg1NX0.HkVBQR4VB9SztDuiOsyKBH4gkd-A1eiwFKeTbIHmKbQ';
        
        let supabaseClient;
        let channel;

        let myTeamName = "";
        let auctionTimeLimit = 5;
        let currentTimer = 0;
        let timerInterval = null;
        let isAuctionActive = false;
        let currentWinner = "";
        let currentAuctionValue = 0;
        
        let playersList = [];

        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            channel = supabaseClient.channel('fanta-room');
        } catch (e) {
            alert("Errore critico nell'avvio del database.");
        }

        function unlockAudio() {
            ['audio-prep', 'audio-start', 'audio-buzz', 'audio-end'].forEach(id => {
                let a = document.getElementById(id);
                if(a) {
                    a.volume = 0;
                    let playPromise = a.play();
                    if (playPromise !== undefined) {
                        playPromise.then(_ => {
                            a.pause(); a.currentTime = 0; a.volume = 1;
                        }).catch(error => {});
                    }
                }
            });
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function setDeviceMode(mode) {
            unlockAudio();
            const dashboard = document.getElementById('auction-dashboard');
            dashboard.classList.remove('mode-pc', 'mode-mobile');
            dashboard.classList.add('mode-' + mode);
            showScreen('screen-auctioneer-setup');
            
            if (playersList.length === 0) {
                fetchListone();
            }
        }

        async function fetchListone() {
            const statusEl = document.getElementById('excel-status');
            const btnPlancia = document.getElementById('btn-apri-plancia');
            
            try {
                const response = await fetch('listone.xlsx');
                if (!response.ok) throw new Error("File non trovato");
                
                const data = await response.arrayBuffer();
                const workbook = window.XLSX.read(data, {type: 'array'});
                const firstSheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[firstSheetName];
                const jsonData = window.XLSX.utils.sheet_to_json(worksheet, {range: 1});
                
                playersList = jsonData.filter(row => row.Id && row.Nome);
                renderTable(playersList);
                
                statusEl.innerHTML = `✅ Listone trovato! (${playersList.length} calciatori)`;
                statusEl.style.color = "var(--accent-green)";
                btnPlancia.disabled = false;
                
            } catch(e) {
                statusEl.innerHTML = `⚠️ <b>listone.xlsx</b> non trovato.<br><span style="font-size:0.8rem; color:var(--text-muted); display:block; margin-top:5px;">Rinomina il tuo Excel in "listone.xlsx" e caricalo su GitHub per proseguire.</span>`;
                statusEl.style.color = "var(--accent-red)";
                btnPlancia.disabled = true;
            }
        }

        let sortCol = '';
        let sortAsc = true;
        
        function sortTable(col) {
            if(sortCol === col) sortAsc = !sortAsc;
            else { sortCol = col; sortAsc = true; }
            
            playersList.sort((a, b) => {
                let valA = col === 'Val' ? (a.FVM !== undefined ? a.FVM : a['Qt.A']) : a[col];
                let valB = col === 'Val' ? (b.FVM !== undefined ? b.FVM : b['Qt.A']) : b[col];
                
                if(valA === undefined) valA = '';
                if(valB === undefined) valB = '';
                
                if(typeof valA === 'string' && typeof valB === 'string') {
                    return sortAsc ? valA.localeCompare(valB) : valB.localeCompare(valA);
                } else {
                    return sortAsc ? valA - valB : valB - valA;
                }
            });
            filterTable({target: {value: document.getElementById('player-search').value}});
        }

        function renderTable(list) {
            const tbody = document.getElementById('players-tbody');
            tbody.innerHTML = '';
            list.forEach(p => {
                const tr = document.createElement('tr');
                tr.onclick = () => selectAndStartPlayer(p.Id);
                
                let roleClass = `role-${p.R}`;
                let val = p.FVM !== undefined ? p.FVM : p['Qt.A'];
                if(val === undefined) val = '-';

                tr.innerHTML = `
                    <td><span class="role-badge ${roleClass}">${p.R}</span></td>
                    <td style="font-weight: 800;">${p.Nome}</td>
                    <td style="color: var(--text-muted);">${p.Squadra}</td>
                    <td style="text-align: right; font-weight: 800; color: var(--accent-blue);">${val}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        function filterTable(e) {
            const term = e.target.value.toLowerCase();
            const filtered = playersList.filter(p => 
                p.Nome.toLowerCase().includes(term) || 
                p.Squadra.toLowerCase().includes(term)
            );
            renderTable(filtered);
        }

        function changeTimer() {
            let newTime = prompt("Imposta i secondi del timer dell'Asta:", auctionTimeLimit);
            if(newTime && !isNaN(newTime)) {
                auctionTimeLimit = parseInt(newTime);
                alert("Timer aggiornato a " + auctionTimeLimit + " secondi.");
            }
        }

        function selectAndStartPlayer(id) {
            const player = playersList.find(p => p.Id === id);
            if(player) {
                if(confirm(`Avviare l'asta per ${player.Nome}?`)) {
                    const imgUrl = `https://content.fantacalcio.it/web/campioncini/21/card/${player.Id}.png?v=649`;
                    document.getElementById('auction-player-name-top').innerText = player.Nome;
                    document.getElementById('card-image').src = imgUrl;
                    
                    if(channel) {
                        channel.send({
                            type: 'broadcast',
                            event: 'new_player',
                            payload: { url: imgUrl, nome: player.Nome }
                        }).catch(e => console.log("Canale broadcast non pronto"));
                    }

                    document.getElementById('view-list').style.display = 'none';
                    document.getElementById('view-auction').style.display = 'flex';
                    startCountdown();
                }
            }
        }

        function backToList() {
            document.getElementById('view-auction').style.display = 'none';
            document.getElementById('view-list').style.display = 'flex';
            document.getElementById('btn-next').style.display = 'none'; 
            
            document.getElementById('player-search').value = '';
            filterTable({target: {value: ''}});
        }

        // --- LOGICA GIOCATORE ---
        function joinAsPlayer() {
            const nameInput = document.getElementById('team-name').value.trim();
            if (!nameInput) { alert("Inserisci il nome della tua squadra!"); return; }
            myTeamName = nameInput;
            document.getElementById('display-team-name').innerText = myTeamName;
            
            unlockAudio();
            showScreen('screen-player-buzzer');

            if (channel) {
                channel.on('broadcast', { event: 'new_player' }, (payload) => {
                    const data = payload.payload;
                    document.getElementById('phone-card-image').src = data.url;
                    if(data.nome) document.getElementById('phone-player-name').innerText = data.nome;
                    
                    // Reset info asta
                    document.getElementById('player-current-winner').innerText = "Nessuno";
                    document.getElementById('player-current-winner').style.color = "var(--text-muted)";
                    document.getElementById('player-current-value').innerText = "0";
                    
                    document.getElementById('phone-card-container').style.visibility = 'visible';
                });
                
                channel.on('broadcast', { event: 'auction_update' }, (payload) => {
                    const data = payload.payload;
                    
                    let winnerEl = document.getElementById('player-current-winner');
                    winnerEl.innerText = data.winner;
                    
                    // Se sto vincendo io, nome verde. Se vince un altro, rosso.
                    if (data.winner === myTeamName) {
                        winnerEl.style.color = "var(--accent-green)";
                    } else {
                        winnerEl.style.color = "var(--accent-red)";
                    }
                    
                    document.getElementById('player-current-value').innerText = data.value;
                });

                channel.subscribe();
            }
        }

        function buzz(amount) {
            if (navigator.vibrate) navigator.vibrate(40);
            if (channel) {
                channel.send({
                    type: 'broadcast',
                    event: 'buzz',
                    payload: { team: myTeamName, amount: amount }
                }).catch(e => console.log("Errore di rete invio buzz."));
            }
        }

        // --- LOGICA BANDITORE ---
        function joinAsAuctioneer() {
            auctionTimeLimit = parseInt(document.getElementById('auction-seconds').value) || 5;
            showScreen('screen-auctioneer-board');

            if (channel) {
                channel.on('broadcast', { event: 'buzz' }, (payload) => {
                    let data = payload.payload;
                    if(data && data.team) {
                        handleBuzzReceived(data.team, data.amount);
                    }
                }).subscribe();
            }
        }

        function startCountdown() {
            document.getElementById('winner-display').innerText = "PREPARAZIONE";
            document.getElementById('winner-display').style.color = "var(--text-muted)";
            document.getElementById('countdown-display').style.color = "var(--text-main)";
            
            currentWinner = "";
            currentAuctionValue = 0;
            document.getElementById('current-value-display').innerText = currentAuctionValue;
            
            isAuctionActive = false;
            
            let prepTime = 5;
            document.getElementById('countdown-display').innerText = prepTime;
            
            const prepInterval = setInterval(() => {
                prepTime--;
                if (prepTime > 0) {
                    document.getElementById('countdown-display').innerText = prepTime;
                    playSound('audio-prep');
                } else {
                    clearInterval(prepInterval);
                    startAuction();
                }
            }, 1000);
        }

        function startAuction() {
            isAuctionActive = true;
            currentTimer = auctionTimeLimit;
            document.getElementById('countdown-display').innerText = currentTimer;
            document.getElementById('countdown-display').style.color = "var(--accent-green)";
            document.getElementById('winner-display').innerText = "ASTA APERTA";
            document.getElementById('winner-display').style.color = "var(--accent-green)";
            playSound('audio-start');
            
            timerInterval = setInterval(() => {
                currentTimer--;
                document.getElementById('countdown-display').innerText = currentTimer;
                
                if(currentTimer <= 2 && currentTimer > 0) {
                    document.getElementById('countdown-display').style.color = "var(--accent-red)";
                }
                
                if (currentTimer <= 0) {
                    endAuction();
                }
            }, 1000);
        }

        function handleBuzzReceived(teamName, amount) {
            if (!isAuctionActive) return; 
            
            let raise = parseInt(amount) || 1;
            
            currentWinner = teamName;
            currentAuctionValue += raise;
            currentTimer = auctionTimeLimit;
            
            document.getElementById('winner-display').innerText = currentWinner;
            document.getElementById('winner-display').style.color = "var(--accent-blue)";
            
            document.getElementById('current-value-display').innerText = currentAuctionValue;
            
            document.getElementById('countdown-display').innerText = currentTimer;
            document.getElementById('countdown-display').style.color = "var(--accent-green)";
            
            playSound('audio-buzz');

            if(channel) {
                channel.send({
                    type: 'broadcast',
                    event: 'auction_update',
                    payload: { winner: currentWinner, value: currentAuctionValue }
                });
            }
        }

        function endAuction() {
            clearInterval(timerInterval);
            isAuctionActive = false;
            
            let winnerEl = document.getElementById('winner-display');
            let timerEl = document.getElementById('countdown-display');
            
            if (currentWinner === "") {
                winnerEl.innerText = "INVENDUTO";
                winnerEl.style.color = "var(--text-muted)";
                timerEl.style.color = "var(--text-muted)";
            } else {
                winnerEl.innerText = currentWinner;
                winnerEl.style.color = "var(--accent-blue)";
                timerEl.style.color = "var(--accent-blue)";
            }
            
            playSound('audio-end');
            
            document.getElementById('btn-next').style.display = 'flex';
            timerEl.innerText = "0";
        }

        function playSound(elementId) {
            let sound = document.getElementById(elementId);
            if (sound) {
                sound.currentTime = 0; 
                let playPromise = sound.play();
                if (playPromise !== undefined) {
                    playPromise.catch(e => console.log("Audio in attesa di interazione"));
                }
            }
        }
    </script>
</body>
</html>
