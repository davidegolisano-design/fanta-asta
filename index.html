<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fanta Buzzer - Leghe Style</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --fc-blue: #003a8c; --fc-dark-blue: #001f54; --fc-green: #00c05a;
            --fc-green-dark: #009647; --fc-gold: #ffcc00; --text-light: #ffffff;
            --text-dark: #333333; --bg-card: #ffffff;
        }

        body { 
            font-family: 'Montserrat', sans-serif; margin: 0; padding: 0; display: flex; 
            flex-direction: column; align-items: center; justify-content: center; height: 100vh; 
            background: linear-gradient(135deg, var(--fc-blue) 0%, var(--fc-dark-blue) 100%); 
            color: var(--text-light); text-align: center; overflow: hidden; touch-action: manipulation; 
        }

        .screen { display: none; width: 100%; height: 100%; flex-direction: column; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box; }
        .active { display: flex; }

        .setup-card { background-color: var(--bg-card); color: var(--text-dark); padding: 40px 30px; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.4); width: 90%; max-width: 400px; }

        h1 { font-size: 2.2rem; font-weight: 900; margin-bottom: 0.5rem; text-transform: uppercase; letter-spacing: -1px; }
        .logo-text { color: var(--fc-blue); } .logo-text span { color: var(--fc-green); }
        p.subtitle { color: #666; font-weight: 700; margin-bottom: 30px; }

        input { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; font-weight: 700; padding: 15px; margin-bottom: 20px; text-align: center; width: 100%; box-sizing: border-box; border: 2px solid #e0e0e0; border-radius: 12px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--fc-blue); box-shadow: 0 0 10px rgba(0, 58, 140, 0.2); }
        
        .btn { font-family: 'Montserrat', sans-serif; font-size: 1.2rem; padding: 15px 30px; margin: 10px 0; width: 100%; cursor: pointer; border: none; border-radius: 12px; background-color: var(--fc-green); color: white; font-weight: 900; text-transform: uppercase; box-shadow: 0 6px 0 var(--fc-green-dark); transition: 0.1s; -webkit-tap-highlight-color: transparent; }
        .btn:active { transform: translateY(6px); box-shadow: 0 0 0 var(--fc-green-dark); }
        .btn-secondary { background-color: #f0f2f5; color: var(--text-dark); box-shadow: 0 6px 0 #d1d5db; }
        .btn-secondary:active { box-shadow: 0 0 0 #d1d5db; }
        .btn-blue { background-color: var(--fc-blue); box-shadow: 0 6px 0 var(--fc-dark-blue); }
        .btn-blue:active { box-shadow: 0 0 0 var(--fc-dark-blue); }
        
        #display-team-name { color: var(--fc-gold); margin-bottom: 40px; font-size: 2.5rem; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 4px 10px rgba(0,0,0,0.5); }

        .buzzer-btn { width: 85vw; height: 85vw; max-width: 350px; max-height: 350px; border-radius: 50%; background: radial-gradient(circle, #ff4b4b 0%, #d32f2f 100%); border: 8px solid rgba(255,255,255,0.2); color: white; font-family: 'Montserrat', sans-serif; font-size: 4rem; font-weight: 900; text-transform: uppercase; box-shadow: 0 25px 0 #9a0007, 0 30px 30px rgba(0,0,0,0.6); cursor: pointer; user-select: none; transition: 0.1s; -webkit-tap-highlight-color: transparent; }
        .buzzer-btn:active { transform: translateY(25px); box-shadow: 0 0 0 #9a0007, 0 5px 10px rgba(0,0,0,0.6); }

        .status { margin-top: 30px; font-size: 1rem; color: rgba(255,255,255,0.7); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }

        .dashboard { width: 95%; max-width: 1400px; height: 90vh; display: flex; flex-direction: column; justify-content: center; align-items: center; background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.1); border-radius: 30px; backdrop-filter: blur(10px); padding: 40px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); }

        @media (min-width: 768px) and (orientation: landscape) {
            .dashboard-layout { display: flex; width: 100%; height: 100%; align-items: center; justify-content: space-between; }
            .dashboard-left { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; text-align: left; padding-right: 50px; }
            .dashboard-right { flex: 1; display: flex; justify-content: center; align-items: center; border-left: 2px solid rgba(255,255,255,0.1); }
            #countdown-display { font-size: 15rem !important; }
            #winner-display { font-size: 5rem !important; text-align: left; }
            .auction-title { display: block !important; font-size: 2rem; color: var(--fc-gold); font-weight: 900; margin-bottom: 20px; text-transform: uppercase; }
        }

        .auction-title { display: none; }
        #countdown-display { font-size: 10rem; font-weight: 900; color: var(--fc-green); line-height: 1; text-shadow: 0 10px 20px rgba(0,0,0,0.5); font-variant-numeric: tabular-nums; }
        #winner-display { font-size: 3rem; font-weight: 900; color: var(--text-light); min-height: 1.2em; word-wrap: break-word; text-transform: uppercase; margin: 20px 0; line-height: 1.1; }
        .via-btn { font-size: 4rem; padding: 30px 80px; background-color: var(--fc-green); box-shadow: 0 15px 0 var(--fc-green-dark); border-radius: 25px; width: auto; letter-spacing: 2px; }
        .via-btn:active { transform: translateY(15px); box-shadow: 0 0 0 var(--fc-green-dark); }
        .brand-footer { position: absolute; bottom: 15px; font-size: 0.8rem; color: rgba(255,255,255,0.4); font-weight: 700; }
    </style>
</head>
<body>

    <!-- 1. Scelta Ruolo -->
    <div id="screen-role" class="screen active">
        <div class="setup-card">
            <h1 class="logo-text">Fanta<span>Buzzer</span></h1>
            <p class="subtitle">Scegli il tuo dispositivo</p>
            <button class="btn btn-blue" onclick="showScreen('screen-player-setup')">📱 Telefono Giocatore</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-auctioneer-setup')" style="margin-top: 15px;">💻 PC Banditore</button>
        </div>
        <div class="brand-footer">UNOFFICIAL FANTA TOOL</div>
    </div>

    <!-- 2. Setup Giocatore -->
    <div id="screen-player-setup" class="screen">
        <div class="setup-card">
            <h1 class="logo-text" style="font-size: 1.8rem;">Nome Squadra</h1>
            <p class="subtitle">Inserisci il nome del tuo team</p>
            <input type="text" id="team-name" placeholder="Es. Real Madrid..." autocomplete="off">
            <button class="btn" onclick="joinAsPlayer()">Entra nell'Asta</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-role')" style="margin-top:15px; font-size: 1rem; padding: 10px;">Indietro</button>
        </div>
    </div>

    <!-- 3. Buzzer Giocatore -->
    <div id="screen-player-buzzer" class="screen">
        <h2 id="display-team-name"></h2>
        <button class="buzzer-btn" id="buzz-button" onpointerdown="buzz()">BUZZ</button>
        <div class="status" id="player-status" style="color: var(--fc-gold);">Connessione al server in corso...</div>
    </div>

    <!-- 4. Setup Banditore -->
    <div id="screen-auctioneer-setup" class="screen">
        <div class="setup-card">
            <h1 class="logo-text" style="font-size: 1.8rem;">Impostazioni Asta</h1>
            <p class="subtitle">Secondi per aggiudicarsi il giocatore</p>
            <input type="number" id="auction-seconds" value="5" min="1" max="60">
            <button class="btn btn-blue" onclick="joinAsAuctioneer()">Apri Plancia</button>
            <button class="btn btn-secondary" onclick="showScreen('screen-role')" style="margin-top:15px; font-size: 1rem; padding: 10px;">Indietro</button>
        </div>
    </div>

    <!-- 5. Plancia Banditore (Dashboard) -->
    <div id="screen-auctioneer-board" class="screen">
        <div class="dashboard">
            <div class="dashboard-layout">
                <div class="dashboard-left">
                    <div class="auction-title">Miglior Offerente:</div>
                    <div id="winner-display">IN ATTESA...</div>
                    <button class="btn via-btn" id="btn-via" onclick="startCountdown()">VIA!</button>
                </div>
                <div class="dashboard-right">
                    <div id="countdown-display"></div>
                </div>
            </div>
        </div>
        <div class="status" id="auctioneer-status" style="position: absolute; bottom: 20px; font-weight:bold;">Connessione in corso...</div>
    </div>

    <!-- SISTEMA AUDIO CON FILE MP3 -->
    <audio id="audio-prep" src="preparazione.mp3" preload="auto"></audio>
    <audio id="audio-start" src="fischio.mp3" preload="auto"></audio>
    <audio id="audio-buzz" src="buzz.mp3" preload="auto"></audio>
    <audio id="audio-end" src="gong.mp3" preload="auto"></audio>

    <script>
        const SUPABASE_URL = 'https://hphslrpgohrfdecvvhap.supabase.co';
        const SUPABASE_ANON_KEY = 'EyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhwaHNscnBnb2hyZmRlY3Z2aGFwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY3MDc4NTUsImV4cCI6MjEwMjI4Mzg1NX0.HkVBQR4VB9SztDuiOsyKBH4gkd-A1eiwFKeTbIHmKbQ';
        
        let supabaseClient;
        let channel;
        let myTeamName = "";
        let auctionTimeLimit = 5;
        let currentTimer = 0;
        let timerInterval = null;
        let isAuctionActive = false;
        let currentWinner = "";

        try {
            supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
            channel = supabaseClient.channel('fanta-room');
        } catch (e) {
            console.error("Errore inizializzazione Supabase", e);
            alert("Errore critico nell'avvio del database. Sei offline?");
        }

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function joinAsPlayer() {
            const nameInput = document.getElementById('team-name').value.trim();
            if (!nameInput) { alert("Inserisci il nome della tua squadra!"); return; }
            myTeamName = nameInput;
            document.getElementById('display-team-name').innerText = myTeamName;
            showScreen('screen-player-buzzer');

            if (channel) {
                channel.subscribe((status, err) => {
                    let statusEl = document.getElementById('player-status');
                    if (status === 'SUBSCRIBED') {
                        statusEl.innerText = "Pronto! Dito sul pulsante.";
                        statusEl.style.color = "var(--fc-green)";
                    } else if (status === 'CHANNEL_ERROR' || status === 'TIMED_OUT') {
                        statusEl.innerText = "ERRORE CONNESSIONE! Ricarica o prova da GitHub Pages.";
                        statusEl.style.color = "#ff4b4b";
                    }
                });
            } else {
                document.getElementById('player-status').innerText = "Errore Supabase non avviato.";
                document.getElementById('player-status').style.color = "#ff4b4b";
            }
        }

        function buzz() {
            if (navigator.vibrate) navigator.vibrate(50);
            if (channel) {
                channel.send({ type: 'broadcast', event: 'buzz', payload: { team: myTeamName } }).catch(e => {
                    document.getElementById('player-status').innerText = "Errore invio (Offline?)";
                });
                
                let statusEl = document.getElementById('player-status');
                statusEl.innerText = "BUZZ INVIATO!";
                statusEl.style.color = "white";
                setTimeout(() => { 
                    if(statusEl.innerText === "BUZZ INVIATO!") {
                        statusEl.innerText = "Pronto! Dito sul pulsante."; 
                        statusEl.style.color = "var(--fc-green)";
                    }
                }, 1000);
            }
        }

        function joinAsAuctioneer() {
            auctionTimeLimit = parseInt(document.getElementById('auction-seconds').value) || 5;
            showScreen('screen-auctioneer-board');
            document.getElementById('countdown-display').innerText = "--";

            if (channel) {
                channel.on('broadcast', { event: 'buzz' }, (payload) => {
                    handleBuzzReceived(payload.team);
                }).subscribe((status, err) => {
                    let statusEl = document.getElementById('auctioneer-status');
                    if (status === 'SUBSCRIBED') {
                        statusEl.innerText = "Sistema Online - In attesa di chiamare il giocatore";
                        statusEl.style.color = "var(--fc-green)";
                    } else if (status === 'CHANNEL_ERROR') {
                        statusEl.innerText = "ERRORE CONNESSIONE: Impossibile collegarsi al database.";
                        statusEl.style.color = "#ff4b4b";
                    } else if (status === 'TIMED_OUT') {
                        statusEl.innerText = "ERRORE: Timeout di Rete (forse colpa di un Antivirus/AdBlocker)";
                        statusEl.style.color = "#ffcc00";
                    } else {
                        statusEl.innerText = "Stato: " + status;
                    }
                });
            } else {
                document.getElementById('auctioneer-status').innerText = "Errore critico: Supabase offline.";
                document.getElementById('auctioneer-status').style.color = "red";
            }
            initAudio();
        }

        function startCountdown() {
            document.getElementById('btn-via').style.display = 'none';
            document.getElementById('winner-display').innerText = "PREPARARSI...";
            document.getElementById('winner-display').style.color = "var(--fc-gold)";
            document.getElementById('countdown-display').style.color = "var(--text-light)";
            currentWinner = "";
            isAuctionActive = false;
            
            let prepTime = 5;
            document.getElementById('countdown-display').innerText = prepTime;
            
            const prepInterval = setInterval(() => {
                prepTime--;
                if (prepTime > 0) {
                    document.getElementById('countdown-display').innerText = prepTime;
                    playSound('audio-prep');
                } else {
                    clearInterval(prepInterval);
                    startAuction();
                }
            }, 1000);
        }

        function startAuction() {
            isAuctionActive = true;
            currentTimer = auctionTimeLimit;
            document.getElementById('countdown-display').innerText = currentTimer;
            document.getElementById('countdown-display').style.color = "var(--fc-green)";
            document.getElementById('winner-display').innerText = "ASTA APERTA!";
            document.getElementById('winner-display').style.color = "var(--fc-green)";
            playSound('audio-start');
            
            timerInterval = setInterval(() => {
                currentTimer--;
                document.getElementById('countdown-display').innerText = currentTimer;
                
                if(currentTimer <= 2 && currentTimer > 0) {
                    document.getElementById('countdown-display').style.color = "#ff4b4b";
                }
                if (currentTimer <= 0) { endAuction(); }
            }, 1000);
        }

        function handleBuzzReceived(teamName) {
            if (!isAuctionActive) return; 
            currentWinner = teamName;
            currentTimer = auctionTimeLimit;
            document.getElementById('winner-display').innerText = currentWinner;
            document.getElementById('winner-display').style.color = "white";
            document.getElementById('countdown-display').innerText = currentTimer;
            document.getElementById('countdown-display').style.color = "var(--fc-green)";
            
            playSound('audio-buzz');
            
            let timerEl = document.getElementById('countdown-display');
            timerEl.style.transform = "scale(1.2)";
            setTimeout(() => { timerEl.style.transform = "scale(1)"; }, 150);
        }

        function endAuction() {
            clearInterval(timerInterval);
            isAuctionActive = false;
            let winnerEl = document.getElementById('winner-display');
            let timerEl = document.getElementById('countdown-display');
            
            if (currentWinner === "") {
                winnerEl.innerText = "INVENDUTO";
                winnerEl.style.color = "rgba(255,255,255,0.5)";
                timerEl.style.color = "rgba(255,255,255,0.5)";
            } else {
                winnerEl.innerText = currentWinner;
                winnerEl.style.color = "var(--fc-gold)";
                timerEl.style.color = "var(--fc-gold)";
            }
            playSound('audio-end');
            
            document.getElementById('btn-via').style.display = 'inline-block';
            document.getElementById('btn-via').innerText = "PROSSIMO GIOCATORE";
            document.getElementById('btn-via').style.fontSize = "2rem";
            timerEl.innerText = "0";
        }

        function initAudio() {}

        function playSound(elementId) {
            let sound = document.getElementById(elementId);
            if (sound) {
                sound.currentTime = 0; 
                sound.play().catch(e => console.log("Attesa interazione utente per l'audio"));
            }
        }
    </script>
</body>
</html>
